version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gold_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gold_db
      FRED_API_KEY: ${FRED_API_KEY}
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  dashboard:
    build: .
    command: streamlit run src/dashboard/app.py --server.address=0.0.0.0
    environment:
      API_BASE: http://api:8000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gold_db
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  pgdata:
